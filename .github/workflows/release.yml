name: Release

on:
  push:
    tags: ['v*']

jobs:
  hmods:
    # Keep in sync with the vendor/hmod-build submodule tag.
    uses: DefKorns/hmod-build/.github/workflows/hmod.yml@v1.6.0
    with:
      release-name: RetroArch (S)NESCE cores
      make: hmods
      docker: true
    secrets: inherit
    permissions:
      contents: write
